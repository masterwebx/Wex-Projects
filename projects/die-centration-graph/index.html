<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Die Centration Radial Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5; --bg-elev: #ffffff; --text: #12202b; --muted: #3e4a55; --line: #d5dde4;
    --accent: #1d4ed8; --ok: #166534; --ok-bg: #dcfce7; --thin: #92400e; --thin-bg: #fef3c7;
    --thick: #991b1b; --thick-bg: #fee2e2; --idle: #f8fafc; --shadow: 0 8px 24px rgba(15, 23, 42, .08);
  }
  html[data-theme="dark"] {
    --bg: #0c1116; --bg-elev: #151c24; --text: #f3f7fb; --muted: #c5d0db; --line: #2a3541;
    --accent: #3b82f6; --ok: #86efac; --ok-bg: #14532d; --thin: #fcd34d; --thin-bg: #78350f;
    --thick: #fca5a5; --thick-bg: #7f1d1d; --idle: #0f1620; --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 18px; overflow: hidden;
  }
  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; padding: 10px 12px; gap: 8px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 24px; margin: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .layout {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(260px, 340px) minmax(0, 1fr) minmax(250px, 300px);
    gap: 12px;
  }
  .card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-height: 0; }
  .panel { padding: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel h2, .side h2 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; overflow: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field label { font-size: 16px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .field input, .specs input, .modal input, .history select {
    width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 7px 8px;
    font: inherit; font-size: 18px; background: var(--idle); color: var(--text);
  }
  .field input, .specs input, .modal input {
    text-align: center; appearance: textfield; -moz-appearance: textfield;
  }
  .history select { text-align: left; font-size: 15px; }
  .history { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .history[hidden] { display: none; }
  .history label { display: flex; flex-direction: column; gap: 3px; font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .histMeta { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.35; }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button,
  .specs input::-webkit-outer-spin-button, .specs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field.in input { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .field.thin input { background: var(--thin-bg); border-color: var(--thin); color: var(--thin); font-weight: 700; }
  .field.thick input { background: var(--thick-bg); border-color: var(--thick); color: var(--thick); font-weight: 700; }
  .actions { display: grid; gap: 8px; flex-shrink: 0; }
  .side { padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .specs { display: grid; gap: 8px; }
  .specs label { font-size: 15px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .specs input { width: 108px; flex: 0 0 108px; }
  button {
    border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 700; min-height: 44px;
  }
  button.secondary { background: var(--bg-elev); color: var(--text); border: 2px solid var(--line); }
  button.full { width: 100%; }
  button.copied { background: var(--ok); color: #fff; border-color: var(--ok); }
  .stat, .alert {
    border-radius: 999px; padding: 14px 18px; font-size: 18px; font-weight: 700;
    line-height: 1.2; border: 2px solid var(--line); background: var(--idle);
  }
  .stat { display: flex; justify-content: space-between; gap: 12px; }
  .stat.good, .alert.good { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .stat.bad, .alert.bad { background: var(--thick-bg); color: var(--thick); border-color: var(--thick); }
  .canvas-wrap { display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }
  .canvas-head { padding: 8px 12px; font-size: 16px; color: var(--muted); font-weight: 700; display: flex; justify-content: flex-end; border-bottom: 1px solid var(--line); }
  .stage { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
  canvas { display: block; max-width: 100%; max-height: 100%; }
  .legend { display: flex; gap: 12px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { width: min(440px, 100%); background: var(--bg-elev); color: var(--text); border-radius: 16px; padding: 18px; border: 1px solid var(--line); }
  .modal h3 { margin: 0 0 12px; font-size: 22px; }
  .modal label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; font-weight: 700; }
  .modal input { width: 100px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; margin: 12px 0; }
  .switch { position: relative; width: 52px; height: 30px; flex: 0 0 52px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer; }
  .slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 4px; top: 4px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(22px); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  #clipCatcher { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg-elev); padding: 10px 16px; border-radius: 999px; font-weight: 700; display: none; z-index: 30; }
  .toast.show { display: block; }
  @media (max-width: 1100px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; overflow: visible; }
    .layout { grid-template-columns: 1fr; }
    .panel { max-height: 70dvh; }
    .stage { min-height: 380px; }
  }
</style>
</head>
<body>
<textarea id="clipCatcher" aria-hidden="true"></textarea>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <h1>Die Centration Radial Graph</h1>
    <div class="toolbar">
      <button class="secondary" id="themeBtn" type="button">Dark mode</button>
      <button class="secondary" id="settingsBtn" type="button">Settings</button>
      <button class="secondary" id="arrowToggle" type="button">Show arrow</button>
      <button class="secondary" id="resetArrowBtn" type="button" hidden>Reset arrow</button>
    </div>
  </header>
  <div class="layout">
    <section class="card panel">
      <div class="history" id="historyBox" hidden>
        <h2>Past results</h2>
        <label>Item #<select id="histItem"></select></label>
        <label>Record<select id="histRecord"></select></label>
        <p class="histMeta" id="histMeta"></p>
      </div>
      <h2>Thickness points</h2>
      <div class="grid" id="inputs"></div>
      <div class="actions">
        <button class="full" id="clipBtn" type="button">Apply from clipboard</button>
        <button class="secondary full" id="copyBtn" type="button">Copy values</button>
        <button class="secondary full" id="clearBtn" type="button">Clear values</button>
      </div>
    </section>
    <section class="card canvas-wrap">
      <div class="canvas-head">
        <div class="legend">
          <span><i class="swatch" style="background:#3c9d5a"></i>In spec</span>
          <span><i class="swatch" style="background:#e2b340"></i>Thin</span>
          <span><i class="swatch" style="background:#c24141"></i>Thick</span>
        </div>
      </div>
      <div class="stage"><canvas id="dieCanvas" width="700" height="700"></canvas></div>
    </section>
    <aside class="card side">
      <h2>Specs</h2>
      <div class="specs">
        <label>Min thickness <input type="number" id="minThickness" step="0.001" value="0.240"></label>
        <label>Max thickness <input type="number" id="maxThickness" step="0.001" value="0.260"></label>
        <label>Range spec max <input type="number" id="rangeSpec" step="0.001" value="0.010"></label>
      </div>
      <h2>Results</h2>
      <div id="summary"></div>
    </aside>
  </div>
</div>
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Settings</h3>
    <label>Number of points <input type="number" id="setPoints" min="3" max="36" step="1"></label>
    <label>Centration bolts <input type="number" id="setBolts" min="4" max="24" step="1"></label>
    <div class="toggle">
      <span>Start bolts from bottom</span>
      <label class="switch"><input type="checkbox" id="setBoltStart"><span class="slider"></span></label>
    </div>
    <div class="modal-actions">
      <button type="button" id="saveSettings">Save</button>
      <button class="secondary" type="button" id="cancelSettings">Cancel</button>
    </div>
  </div>
</div>
<script>
const STORE = 'dieGraphState.v3';
const canvas = document.getElementById('dieCanvas');
const ctx = canvas.getContext('2d');
const SOUTH = Math.PI / 2, HANDLE_R = 18;
const catcher = document.getElementById('clipCatcher');
let TOTAL = 13, NUM_BOLTS = 4, ANGLE_STEP = (2 * Math.PI) / TOTAL, startBoltsFromBottom = false;
const points = [], fieldEls = [], markEls = [];
let showArrow = false, customArrow = false, dragKind = null;
let lastMin = 0.240, lastMax = 0.260, lastRangeSpec = 0.010, lastValues = [];
let arrow = { tail: null, head: null };
let S = 700, center = { x: 350, y: 350 };
let YELLOW_R = 96, GREEN_R = 210, MAX_PLOT_R = 275, POINT_R = 7, LABEL_R = 250, COMPASS_R = 330, ARROW_GAP = 52;

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function palette() {
  if (isDark()) {
    return {
      canvas: '#1b2430', yellow: '#c9a227', yellowStroke: '#e0bd55', green: '#2f7d4a', greenStroke: '#5bd08a',
      text: '#f3f7fb', muted: '#d0dbe6', halo: '#1b2430', arrow: '#f3f6fa', handle: '#1b2430', pointStroke: '#0b0f14',
      thinDot: '#e2b340', thickDot: '#ef6b6b', inDot: '#4ade80', idleDot: '#7b8a99', lineOk: '#4ade80', lineBad: '#f87171', bolt: '#1f4e63'
    };
  }
  return {
    canvas: '#f7f9fc', yellow: '#f2c94c', yellowStroke: '#b8860b', green: '#3c9d5a', greenStroke: '#1f7a3a',
    text: '#12202b', muted: '#3e4a55', halo: '#f7f9fc', arrow: '#111827', handle: '#ffffff', pointStroke: '#111827',
    thinDot: '#f2c94c', thickDot: '#b91c1c', inDot: '#22c55e', idleDot: '#94a3b8', lineOk: '#166534', lineBad: '#dc2626', bolt: '#0a4d68'
  };
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}
function loadState() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { return {}; } }
function saveState() {
  localStorage.setItem(STORE, JSON.stringify({
    theme: document.documentElement.getAttribute('data-theme') || 'light',
    showArrow, customArrow, arrow, TOTAL, NUM_BOLTS, startBoltsFromBottom,
    min: document.getElementById('minThickness').value,
    max: document.getElementById('maxThickness').value,
    range: document.getElementById('rangeSpec').value,
    values: points.map(p => p.value)
  }));
}
function applyTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? 'Light mode' : 'Dark mode';
}
function setArrowVisible(on) {
  showArrow = !!on;
  document.getElementById('arrowToggle').textContent = showArrow ? 'Hide arrow' : 'Show arrow';
  document.getElementById('resetArrowBtn').hidden = !showArrow;
}
function setupInputs(savedValues) {
  const container = document.getElementById('inputs');
  container.innerHTML = '';
  points.length = 0; fieldEls.length = 0; markEls.length = 0;
  ANGLE_STEP = (2 * Math.PI) / TOTAL;
  for (let i = 0; i < TOTAL; i++) {
    const field = document.createElement('div'); field.className = 'field';
    const label = document.createElement('label');
    label.innerHTML = `T${i + 1} <span class="mark"></span>`;
    const input = document.createElement('input');
    input.type = 'number'; input.step = '0.001'; input.placeholder = '0.000';
    if (savedValues && savedValues[i] != null && savedValues[i] !== '') input.value = savedValues[i];
    input.addEventListener('input', () => { customArrow = false; calculate(); saveState(); });
    field.append(label, input); container.appendChild(field);
    points.push(input); fieldEls.push(field); markEls.push(label.querySelector('.mark'));
  }
}
function parseRangeSpec(raw) {
  const n = parseFloat(raw); if (!isFinite(n)) return NaN;
  return Math.abs(n) >= 1 ? n / 1000 : n;
}
let historyPack = null;
let currentSnapshot = { values: [], min: '', max: '', range: '', item: '', mspec: '' };

function applyPlainNumbers(values) {
  for (let i = 0; i < Math.min(values.length, TOTAL); i++) {
    const v = values[i];
    points[i].value = (v == null || v === '' || !isFinite(Number(v))) ? '' : Number(v).toFixed(3);
  }
}
function applySpecFields(min, max, range) {
  if (min != null && isFinite(min)) document.getElementById('minThickness').value = Number(min).toFixed(3);
  if (max != null && isFinite(max)) document.getElementById('maxThickness').value = Number(max).toFixed(3);
  if (range != null && isFinite(range)) document.getElementById('rangeSpec').value = Number(range).toFixed(3);
}
function applyDieGraphLines(lines) {
  let min = null, max = null, range = null; const tvals = [];
  let inPoints = false;
  for (const raw of lines) {
    const line = String(raw || '').trim();
    const m = line.match(/^(min|max|range|target|item|mspec)\s*=\s*(.*)$/i);
    if (m && !inPoints) {
      const key = m[1].toLowerCase();
      if (key === 'item' || key === 'mspec' || key === 'target') continue;
      const num = parseFloat(m[2]); if (!isFinite(num)) continue;
      if (key === 'min') min = num; else if (key === 'max') max = num; else range = parseRangeSpec(num);
      continue;
    }
    if (!line && !inPoints) continue;
    inPoints = true;
    if (!line) { tvals.push(''); continue; }
    const num = parseFloat(line);
    tvals.push(isFinite(num) ? num : '');
  }
  applySpecFields(min, max, range);
  if (tvals.some(v => v !== '')) applyPlainNumbers(tvals);
  return { min, max, range, tvals };
}
function applyDieGraph(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  applyDieGraphLines(lines.slice(1));
}
function parseTsv(lines) {
  const nonempty = lines.map(s => String(s ?? '').replace(/\r/g, '')).filter(l => l.length);
  if (!nonempty.length) return { headers: [], rows: [] };
  const headers = nonempty[0].split('\t').map(s => s.trim());
  const rows = [];
  for (let i = 1; i < nonempty.length; i++) {
    const parts = nonempty[i].split('\t');
    const obj = {};
    headers.forEach((h, j) => { obj[h] = parts[j] == null ? '' : parts[j]; });
    rows.push(obj);
  }
  return { headers, rows };
}
function splitDieGraph2(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const sections = { CURRENT: [], LOOKUP: [], TABLES4: [] };
  let cur = null;
  for (const line of lines.slice(1)) {
    const m = line.trim().match(/^\[(CURRENT|LOOKUP|TABLES4)\]$/i);
    if (m) { cur = m[1].toUpperCase(); continue; }
    if (cur) sections[cur].push(line);
  }
  return sections;
}
function col(row, ...names) {
  if (!row) return '';
  for (const n of names) {
    if (row[n] != null && String(row[n]).trim() !== '') return row[n];
  }
  const keys = Object.keys(row);
  for (const n of names) {
    const hit = keys.find(k => k.toLowerCase() === n.toLowerCase());
    if (hit && String(row[hit]).trim() !== '') return row[hit];
  }
  return '';
}
function excelWhen(v) {
  const n = parseFloat(v);
  if (isFinite(n) && n > 20000 && n < 90000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) return d.toLocaleString();
  }
  const s = String(v || '').trim();
  return s || '';
}
function lookupSpecs(mspec) {
  if (!historyPack || !historyPack.lookupByMspec) return null;
  const key = String(mspec || '').trim();
  if (!key) return null;
  const row = historyPack.lookupByMspec[key] || historyPack.lookupByMspec[key.replace(/\.0+$/, '')];
  if (!row) return null;
  const min = parseFloat(col(row, 'Lower Control', 'Lower Spec'));
  const max = parseFloat(col(row, 'Upper Control', 'Upper Spec'));
  const range = parseRangeSpec(col(row, 'Thickness Range Max'));
  return {
    min: isFinite(min) ? min : null,
    max: isFinite(max) ? max : null,
    range: isFinite(range) ? range : null
  };
}
function rowTValues(row) {
  const out = [];
  for (let i = 1; i <= TOTAL; i++) {
    const n = parseFloat(col(row, 'T' + i));
    out.push(isFinite(n) ? n : '');
  }
  return out;
}
function captureCurrentSnapshot(extra) {
  currentSnapshot = {
    values: points.map(p => p.value),
    min: document.getElementById('minThickness').value,
    max: document.getElementById('maxThickness').value,
    range: document.getElementById('rangeSpec').value,
    item: extra && extra.item || currentSnapshot.item || '',
    mspec: extra && extra.mspec || currentSnapshot.mspec || ''
  };
}
function applySnapshot(snap) {
  if (!snap) return;
  document.getElementById('minThickness').value = snap.min;
  document.getElementById('maxThickness').value = snap.max;
  document.getElementById('rangeSpec').value = snap.range;
  for (let i = 0; i < TOTAL; i++) points[i].value = snap.values[i] || '';
}
function hideHistory() {
  historyPack = null;
  document.getElementById('historyBox').hidden = true;
  document.getElementById('histItem').innerHTML = '';
  document.getElementById('histRecord').innerHTML = '';
  document.getElementById('histMeta').textContent = '';
}
function uniqueItems(rows) {
  const seen = new Set();
  const items = [];
  for (const row of rows) {
    const id = String(col(row, 'Item #')).trim();
    if (!id || seen.has(id)) continue;
    seen.add(id);
    items.push(id);
  }
  items.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  return items;
}
function recordsForItem(item) {
  const id = String(item || '').trim();
  const rows = (historyPack && historyPack.rows || [])
    .map((row, idx) => ({ row, idx }))
    .filter(x => String(col(x.row, 'Item #')).trim() === id);
  rows.sort((a, b) => parseFloat(col(b.row, 'Date/Time')) - parseFloat(col(a.row, 'Date/Time')));
  return rows;
}
function fillItemDropdown(preferred) {
  const sel = document.getElementById('histItem');
  const items = uniqueItems(historyPack.rows);
  sel.innerHTML = '';
  if (preferred && !items.includes(preferred)) {
    const opt = document.createElement('option');
    opt.value = preferred; opt.textContent = preferred + ' (current)';
    sel.appendChild(opt);
  }
  for (const id of items) {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = id;
    sel.appendChild(opt);
  }
  if (preferred && (items.includes(preferred) || sel.options.length)) sel.value = preferred;
  else if (items.length) sel.value = items[0];
}
function fillRecordDropdown(selectCurrent) {
  const item = document.getElementById('histItem').value;
  const rec = document.getElementById('histRecord');
  const rows = recordsForItem(item);
  rec.innerHTML = '';
  const cur = document.createElement('option');
  cur.value = '__current__';
  cur.textContent = 'Current sheet';
  rec.appendChild(cur);
  rows.forEach((entry, i) => {
    const opt = document.createElement('option');
    opt.value = String(entry.idx);
    const when = excelWhen(col(entry.row, 'Date/Time')) || 'No date';
    const bundle = col(entry.row, 'Bundle #') || '—';
    const user = col(entry.row, 'User') || '';
    const pf = col(entry.row, 'Pass/Fail') || '';
    opt.textContent = `${when} · Bundle ${bundle}${user ? ' · ' + user : ''}${pf ? ' · ' + pf : ''}`;
    rec.appendChild(opt);
    if (i === 0) opt.dataset.newest = '1';
  });
  rec.value = selectCurrent ? '__current__' : (rows.length ? String(rows[0].idx) : '__current__');
  document.getElementById('histMeta').textContent = rows.length
    ? `${rows.length} past result${rows.length === 1 ? '' : 's'} for this item · ${historyPack.rows.length} total in TableS4`
    : `No past TableS4 rows for this item · ${historyPack.rows.length} total in TableS4`;
}
function applyHistorySelection() {
  const rec = document.getElementById('histRecord');
  if (!rec.value || rec.value === '__current__') {
    applySnapshot(currentSnapshot);
    customArrow = false; calculate(); saveState();
    return;
  }
  const row = historyPack.rows[Number(rec.value)];
  if (!row) return;
  const tvals = rowTValues(row);
  applyPlainNumbers(tvals);
  const specs = lookupSpecs(col(row, 'MSPEC', 'MSPEC #')) || lookupSpecs(currentSnapshot.mspec);

function parseCurrentMeta(lines) {

function applyDieGraph2(text) {

async function clearClipboard() {

}
function applyClipboardText(text) {
  text = (text || '').trim();

  if (/^DIEGRAPH2\b/i.test(text)) applyDieGraph2(text);
  else if (/^DIEGRAPH\b/i.test(text)) { hideHistory(); applyDieGraph(text); }
  else {
    const values = text.split(/[\s,]+/).map(Number).filter(v => !isNaN(v));
    if (!values.length) { toast('No numbers found'); return false; }
    hideHistory();
    applyPlainNumbers(values);
  }
  customArrow = false; calculate(); saveState();
  clearClipboard();

}
function applyFromClipboard() { catcher.focus(); catcher.select(); }
async function copyValues() {
  const lines = points.map(p => { const v = parseFloat(p.value); return isFinite(v) ? v.toFixed(3) : ''; }).join('\n').replace(/\n+$/, '');
  const btn = document.getElementById('copyBtn');
  try {
    await navigator.clipboard.writeText(lines ? lines + '\n' : '');
    btn.textContent = 'Copied!'; btn.classList.add('copied'); toast('Values copied');

  } catch {

    btn.textContent = ok ? 'Copied!' : 'Copy failed'; btn.classList.toggle('copied', ok);

    setTimeout(() => { btn.textContent = 'Copy values'; btn.classList.remove('copied'); }, 1500);

function clearValues() { points.forEach(p => { p.value = ''; }); customArrow = false; calculate(); saveState(); }
function calculate() {
  lastMin = parseFloat(document.getElementById('minThickness').value);
  lastMax = parseFloat(document.getElementById('maxThickness').value);
  lastRangeSpec = parseFloat(document.getElementById('rangeSpec').value);
  if (!isFinite(lastMin)) lastMin = 0;
  if (!isFinite(lastMax) || lastMax <= lastMin) lastMax = lastMin + 0.001;
  lastValues = points.map(p => { const v = parseFloat(p.value); return isNaN(v) ? NaN : v; });

function pointAngle(i) { return SOUTH + (i + 0.5) * ANGLE_STEP; }
function compassAngles() {
  return [
    { label: 'N', angle: -Math.PI / 2 },
    { label: 'E', angle: 0 },
    { label: 'S', angle: Math.PI / 2 },
    { label: 'W', angle: Math.PI }

}
function boltSet() {
  const n = Math.max(4, NUM_BOLTS);
  if (n === 4) return compassAngles().map(b => ({ ...b, kind: 'cardinal' }));
  const start = startBoltsFromBottom ? Math.PI / 2 : -Math.PI / 2;
  const numbered = [];

function layoutCanvas() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';

  ctx.lineTo(x2, y2);
  ctx.lineTo(bx - px * headHalf, by - py * headHalf);

function drawBolt(c, bolt) {

  const by = center.y + Math.sin(bolt.angle) * r;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

function updateSummary(avg, range, min, max, rangeSpec) {
  const avgBad = isFinite(avg) && (avg < min || avg > max);
  const rangeBad = isFinite(range) && range > rangeSpec;
  const avgOk = isFinite(avg) && !avgBad;
  const rangeOk = isFinite(range) && !rangeBad;
  document.getElementById('summary').innerHTML = `
    <div class="stat ${avgBad ? 'bad' : (avgOk ? 'good' : '')}">Average <b>${isFinite(avg) ? avg.toFixed(3) : '--'}</b></div>
    <div class="stat ${rangeBad ? 'bad' : (rangeOk ? 'good' : '')}">Range <b>${isFinite(range) ? range.toFixed(3) : '--'}</b></div>

function draw() {

  ctx.fillStyle = c.green; ctx.beginPath(); ctx.arc(center.x, center.y, GREEN_R, 0, Math.PI * 2); ctx.arc(center.x, center.y, YELLOW_R, 0, Math.PI * 2, true); ctx.fill();

    if (p.val < minVal) { minVal = p.val; minIdx = p.idx; }

function canvasPoint(evt) {

const saved = loadState();
