<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF2 Replay Editor (.ssfrec)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e55a00;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --text-muted: #aaaaaa;
            --border: #333333;
            --warning-bg: #3d2b00;
            --warning-text: #ffaa00;
            --fav-bg: #2a2a2a;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .download-btn {
            background: var(--primary);
            color: white;
            padding: 12px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 18px;
        }
        .download-btn:disabled { background: #555; cursor: not-allowed; }
        #info {
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 20px;
            white-space: pre-wrap;
        }
        .warning {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--card);
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 500;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content {
            background: var(--card);
            padding: 30px;
            border-radius: 8px;
            display: none;
        }
        .tab-content.active { display: block; }
        details { margin-bottom: 15px; background: #252525; padding: 10px; border-radius: 8px; }
        summary { cursor: pointer; font-weight: 600; padding: 10px; background: #2a2a2a; border-radius: 6px; }
        label { display: block; margin: 12px 0 6px; font-weight: 500; }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: var(--text);
            font-family: monospace;
            font-size: 14px;
        }
        textarea { height: 600px; resize: vertical; }
        .path { font-size: 12px; color: var(--text-muted); margin-left: 10px; }
        .player-card { border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #252525; }
        .star { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; margin-left: 8px; }
        .star.favorited { color: gold; }
        .fav-field { background: var(--fav-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .fav-section { margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSF2 Replay Editor (.ssfrec)</h1>
        <p class="subtitle">Structured editor with Quick Access Favorites • Changes update live in both places</p>

        <div class="header-bar">
            <label class="upload-btn">
                Upload .ssfrec Replay
                <input type="file" id="fileInput" accept=".ssfrec" style="display:none;">
            </label>
            <button class="download-btn" id="downloadBtn" disabled>Save Edited Replay</button>
        </div>

        <div id="info">No replay loaded yet.</div>

        <div class="warning">
            <strong>WARNING:</strong> Most variables you edit can break replay.<br>
            Star ★ any field to add it to Quick Access at the top.
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" data-tab="structured">Structured Editor</button>
            <button class="tab-btn" data-tab="raw">Raw JSON</button>
        </div>

        <div id="structured" class="tab-content active"></div>
        <div id="raw" class="tab-content">
            <textarea id="rawJson" placeholder="Raw replay JSON will appear here..."></textarea>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const info = document.getElementById('info');
        const downloadBtn = document.getElementById('downloadBtn');
        const structuredTab = document.getElementById('structured');
        const rawTab = document.getElementById('raw');
        const rawJson = document.getElementById('rawJson');

        let replayData = null;
        let originalFileName = 'edited_replay.ssfrec';

        let favorites = [];
        try {
            favorites = JSON.parse(localStorage.getItem('ssf2_editor_favorites') || '[]');
        } catch (e) {}

        function saveFavorites() {
            try {
                localStorage.setItem('ssf2_editor_favorites', JSON.stringify(favorites));
            } catch (e) {}
        }

        function getByPath(obj, path) {
            if (!path) return undefined;
            const parts = path.replace(/\]\./g, '.').replace(/\[/g, '.').replace(/\]/g, '').split('.').filter(p => p);
            let current = obj;
            for (let part of parts) {
                const num = parseInt(part);
                if (isNaN(num)) {
                    if (current == null || current[part] === undefined) return undefined;
                    current = current[part];
                } else {
                    if (current == null || current.length <= num) return undefined;
                    current = current[num];
                }
            }
            return current;
        }

        function setByPath(obj, path, value) {
            const parts = path.replace(/\]\./g, '.').replace(/\[/g, '.').replace(/\]/g, '').split('.').filter(p => p);
            let current = obj;
            for (let i = 0; i < parts.length - 1; i++) {
                let part = parts[i];
                const num = parseInt(part);
                if (isNaN(num)) {
                    if (current[part] == null) current[part] = {};
                    current = current[part];
                } else {
                    if (current[num] == null) current[num] = {};
                    current = current[num];
                }
            }
            const last = parts[parts.length - 1];
            const num = parseInt(last);
            if (isNaN(num)) current[last] = value;
            else current[num] = value;
        }

        function toggleFavorite(path) {
            if (favorites.includes(path)) {
                favorites = favorites.filter(p => p !== path);
            } else {
                favorites.push(path);
            }
            saveFavorites();
            regenerateStructured();
        }

        function generateFieldHTML(path, value) {
            const key = path.split(/[\.\[\]]/).filter(Boolean).pop();
            const label = key.replace(/([A-Z])/g, ' $1').trim();
            let inputHtml = '';
            if (typeof value === 'boolean') {
                inputHtml = `<input type="checkbox" data-path="${path}" ${value ? 'checked' : ''}>`;
            } else if (typeof value === 'number') {
                inputHtml = `<input type="number" data-path="${path}" value="${value}">`;
            } else if (typeof value === 'object' && value !== null) {
                inputHtml = `<textarea rows="8" data-path="${path}" data-type="json">${JSON.stringify(value, null, 2)}</textarea>`;
            } else {
                inputHtml = `<input type="text" data-path="${path}" value="${value ?? ''}">`;
            }
            const starClass = favorites.includes(path) ? 'favorited' : '';
            return `
                <div class="fav-field">
                    <label>${label} <span class="path">(${path})</span>
                        <button class="star ${starClass}" data-path="${path}">★</button>
                    </label>
                    ${inputHtml}
                    <br><br>
                </div>
            `;
        }

        function generateFavoritesTopHTML() {
            let html = '<div class="fav-section"><h2>Quick Access Favorites</h2>';
            let hasAny = false;
            favorites.forEach(path => {
                const value = getByPath(replayData, path);
                if (value !== undefined) {
                    hasAny = true;
                    html += generateFieldHTML(path, value);
                }
            });
            if (!hasAny) html += '<p>No starred fields in this replay – click ★ below to add.</p>';
            html += '</div>';
            if (hasAny) html += '<hr>';
            return html;
        }

        function generateTreeHTML(obj, prefix = '', depth = 0) {
            let html = '';
            // Removed .sort() to preserve original JSON insertion order
            const keys = Object.keys(obj);
            for (let key of keys) {
                const value = obj[key];
                const path = prefix ? `${prefix}.${key}` : key;
                const label = key.replace(/([A-Z])/g, ' $1').trim();

                // Removed skip for null/undefined – now shows them as editable fields
                if (typeof value === 'object' && value !== null) {
                    let title = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
                    if (Array.isArray(value)) {
                        if (key === 'playerSettings') {
                            html += `<h3>${title} (${value.length} players)</h3>`;
                            value.forEach((player, i) => {
                                const char = player.character ? player.character.charAt(0).toUpperCase() + player.character.slice(1) : 'Empty';
                                const name = player.human && player.name ? player.name : (player.human ? 'Player' : `CPU Lvl ${player.level || 1}`);
                                html += `<details open><summary>Player ${i+1}: ${char} (${name})</summary><div class="player-card">`;
                                html += generateTreeHTML(player, `playerSettings[${i}]`, depth + 1);
                                html += `</div></details>`;
                            });
                        } else if (key === 'controlsData') {
                            html += `<div class="warning">DO NOT EDIT – will break replay!</div>`;
                            const starClass = favorites.includes(path) ? 'favorited' : '';
                            html += `<label>${label} <span class="path">(${path})</span> <button class="star ${starClass}" data-path="${path}">★</button></label>`;
                            html += `<textarea rows="8" data-path="${path}" data-type="json">${JSON.stringify(value)}</textarea><br>`;
                        } else {
                            const openAttr = depth < 2 ? 'open' : '';
                            const starClass = favorites.includes(path) ? 'favorited' : '';
                            html += `<details ${openAttr}><summary>${title} (array, ${value.length}) <button class="star ${starClass}" data-path="${path}">★</button></summary>`;
                            html += `<textarea rows="10" data-path="${path}" data-type="json">${JSON.stringify(value, null, 2)}</textarea><br>`;
                            html += `</details>`;
                        }
                    } else {
                        const openAttr = depth < 1 ? 'open' : '';
                        const starClass = favorites.includes(path) ? 'favorited' : '';
                        html += `<details ${openAttr}><summary>${title} (object) <button class="star ${starClass}" data-path="${path}">★</button></summary>`;
                        html += generateTreeHTML(value, path, depth + 1);
                        html += `</details>`;
                    }
                } else {
                    let inputHtml = '';
                    if (typeof value === 'boolean') {
                        inputHtml = `<input type="checkbox" data-path="${path}" ${value ? 'checked' : ''}>`;
                    } else if (typeof value === 'number') {
                        inputHtml = `<input type="number" data-path="${path}" value="${value}">`;
                    } else {
                        // Handles string, null, undefined – shows as text input (null/undefined as empty)
                        inputHtml = `<input type="text" data-path="${path}" value="${value ?? ''}">`;
                    }
                    const starClass = favorites.includes(path) ? 'favorited' : '';
                    html += `<label>${label} <span class="path">(${path})</span> <button class="star ${starClass}" data-path="${path}">★</button></label>`;
                    html += `${inputHtml}<br>`;
                }
            }
            return html;
        }

        function regenerateStructured() {
            structuredTab.innerHTML = generateFavoritesTopHTML() + generateTreeHTML(replayData);
            attachInputListeners();
        }

        function attachInputListeners() {
            structuredTab.querySelectorAll('input[type="text"], input[type="number"], input[type="checkbox"]').forEach(el => {
                el.addEventListener('change', () => {
                    const path = el.dataset.path;
                    let value;
                    if (el.type === 'checkbox') value = el.checked;
                    else if (el.type === 'number') value = el.value === '' ? null : Number(el.value);
                    else value = el.value || null;
                    setByPath(replayData, path, value);
                    regenerateStructured();
                });
            });

            structuredTab.querySelectorAll('textarea[data-type="json"]').forEach(el => {
                el.addEventListener('blur', () => {
                    const path = el.dataset.path;
                    try {
                        const value = JSON.parse(el.value || 'null');
                        setByPath(replayData, path, value);
                        regenerateStructured();
                    } catch (e) {
                        info.textContent = `Invalid JSON in ${path} – not applied.`;
                    }
                });
            });
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'raw' && replayData) {
                    rawJson.value = JSON.stringify(replayData, null, 2);
                }
            });
        });

        document.addEventListener('click', e => {
            if (e.target.classList.contains('star')) {
                toggleFavorite(e.target.dataset.path);
            }
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFileName = file.name.replace(/\.ssfrec$/i, '') + '_edited.ssfrec';
            info.textContent = `Loading ${file.name}...`;

            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const compressed = new Uint8Array(ev.target.result);
                    const fullDecompressed = pako.inflate(compressed, { to: 'Uint8Array' });
                    const dataView = new DataView(fullDecompressed.buffer);
                    const stringLength = dataView.getUint16(0);
                    const stringBytes = fullDecompressed.slice(2, 2 + stringLength);
                    const jsonStr = new TextDecoder('utf-8').decode(stringBytes);

                    replayData = JSON.parse(jsonStr);
                    regenerateStructured();
                    rawJson.value = jsonStr;
                    downloadBtn.disabled = false;
                    info.textContent = `✔ Replay loaded ${originalFileName}`;
                } catch (err) {
                    info.textContent = `✖ Failed to load replay: ${err.message}`;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        downloadBtn.addEventListener('click', function() {
            if (!replayData) return;

            try {
                let jsonStr;
                if (document.querySelector('.tab-btn[data-tab="structured"]').classList.contains('active')) {
                    jsonStr = JSON.stringify(replayData);
                } else {
                    jsonStr = rawJson.value.trim();
                    JSON.parse(jsonStr); // validate
                }

                const encoder = new TextEncoder();
                const stringBytes = encoder.encode(jsonStr);
                const fullBuffer = new Uint8Array(2 + stringBytes.length);
                new DataView(fullBuffer.buffer).setUint16(0, stringBytes.length);
                fullBuffer.set(stringBytes, 2);

                const compressed = pako.deflate(fullBuffer, {
                    to: 'Uint8Array',
                    level: 6,
                    gzip: false,
                    header: { compression: 8 }
                });

                const blob = new Blob([compressed], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = originalFileName;
                a.click();
                URL.revokeObjectURL(url);

                info.textContent += `\n✔ Saved ${originalFileName} – changes persist on reload!`;
            } catch (err) {
                info.textContent += `\n✖ Save failed: ${err.message}`;
            }
        });
    </script>
</body>
</html>
